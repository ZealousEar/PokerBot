name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        # eval7 0.1.7 ships pre-generated C against the pre-3.11 layout and needs
        # Cython<3 + --no-build-isolation to build (matches README setup).
        run: |
          python -m pip install --upgrade pip
          pip install "Cython<3"
          pip install --no-build-isolation eval7==0.1.7
          pip install -r requirements.txt

      - name: Import audit
        run: python tools/import_audit.py

      - name: Tests
        # The engine clone (ext/fullhouse-engine) is not present in CI, so the
        # engine-backed suites skip via the `requires_engine` marker; the
        # engine-free edge cases and unit tests run.
        run: pytest tests/edge_cases tests/unit

      - name: Execute decision notebook
        # Re-runs the notebook end to end (engine-free) and fails on any cell
        # error. Output goes to /tmp so the committed notebook is untouched.
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=300 \
            --output-dir /tmp \
            notebooks/decision_walkthrough.ipynb
