name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        # eval7 0.1.7 ships pre-generated C against the pre-3.11 layout and needs
        # Cython<3 + wheel + --no-build-isolation to build. A fresh venv has no
        # wheel, so the build fails with "invalid command 'bdist_wheel'" unless
        # wheel is installed first (matches README setup).
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "Cython<3"
          pip install --no-build-isolation eval7==0.1.7
          pip install -r requirements.txt

      - name: Import audit
        # Enforces the forbidden-module AST scan across src/ and a generous
        # time/memory ceiling. The strict 1.5 s cold-import budget is a local
        # hygiene check (docs/playbooks/hardening.md); cold-import time on a
        # fresh CI runner is I/O-bound and varies, so we relax it here to keep
        # the badge stable while still catching a hang or memory blow-up.
        run: python tools/import_audit.py --max-seconds 10 --max-mb 600

      - name: Tests
        # The engine clone (ext/fullhouse-engine) is not present in CI, so the
        # engine-backed suites skip via the `requires_engine` marker; every
        # engine-free unit, integration, and edge test still runs.
        run: pytest -q

      - name: Execute decision notebook
        # Re-runs the notebook end to end (engine-free) and fails on any cell
        # error. Output goes to /tmp so the committed notebook is untouched.
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=300 \
            --output-dir /tmp \
            notebooks/decision_walkthrough.ipynb
